<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>FERAL · 내 월드</title>
    <link rel="stylesheet" href="interface.css" />
  <link rel="stylesheet" href="art-ui.css" />
</head>
  <body class="worldMenu">
    <main>
      <header>
        <div>
          <small>FERAL</small>
          <h1>내 월드</h1>
        </div>
        <a href="index.html" class="gameButton">돌아가기</a>
      </header>
      <div id="worlds"></div>
      <footer><button id="newWorld">＋ 새 월드</button><p id="status" role="status">월드마다 진행을 따로 저장합니다.</p></footer>
    </main>
    <dialog id="createDialog"><h2>새로운 세계</h2>
      <form id="create">
        <label>월드 이름<input
          id="name"
          maxlength="40"
          placeholder="새 월드 이름"
          aria-label="새 월드 이름"
          required
        /></label><label>월드 유형<select id="type" aria-label="월드 유형">
          <option value="expedition">FERAL 탐험 · 연구·던전·자유 제작</option>
          <option value="frontier">첫 신호 · 탐험·건설·공동체 원정</option>
          <option value="island">기본 탐험 맵</option>
          <option value="machine">기계 베타 맵</option></select></label><label>시드<input
          id="seed"
          type="number"
          min="0"
          max="2147483647"
          value="63026"
          aria-label="월드 시드"
        /></label><div class="dialogActions"><button type="button" id="createCancel">취소</button><button>월드 만들기</button></div>
      </form>
    </dialog>
    <dialog id="confirm">
      <p id="confirmText"></p>
      <button id="deleteYes">삭제</button> <button id="deleteNo">취소</button>
    </dialog>
    <dialog id="rename">
      <form id="renameForm">
        <input
          id="renameName"
          maxlength="40"
          aria-label="변경할 이름"
          required
        /><button>변경</button><button type="button" id="renameNo">취소</button>
      </form>
    </dialog>
    <script type="module" src="world-menu.js"></script>
  </body>
</html>
