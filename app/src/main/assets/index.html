<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <meta name="theme-color" content="#162c28" />
    <title>FERAL</title>
    <link rel="stylesheet" href="interface.css" />
    <link rel="stylesheet" href="art-ui.css" />
    <!-- Old world links (index.html?world=…) open the game session page. -->
    <script>if (new URLSearchParams(location.search).has("world")) location.replace("play.html" + location.search);</script>
  </head>
  <!-- The launcher (docs/ARCHITECTURE.md §2–3): everything before entering a world. It never starts the game engine. -->
  <body class="worldMenu launcher">
    <section id="landing" class="launcherLanding">
      <div class="eyebrow">살아 있는 복셀 세계</div>
      <h1>F<span>Ξ</span>RAL</h1>
      <h2>탐험하고, 만들고, 살아남으세요.</h2>
      <nav class="launcherActions" aria-label="런처 메뉴">
        <button id="continueWorld" hidden>이어하기 <small id="continueName"></small></button>
        <button id="openWorlds">월드 선택</button>
        <button id="openSettings">환경 설정</button>
        <button id="openUpdates">업데이트 <small id="updateBadge"></small></button>
      </nav>
      <p id="launcherStatus" role="status"></p>
      <footer><span data-game-version>FERAL</span><span id="appVersion"></span></footer>
    </section>
    <main id="worldsView" hidden>
      <header>
        <div><small>FERAL</small><h1>내 월드</h1></div>
        <button class="launcherBack">← 처음으로</button>
      </header>
      <div id="worlds"></div>
      <footer><button id="newWorld">＋ 새 월드</button><p id="status" role="status">월드마다 설정과 진행을 따로 저장합니다. 게임 버전이 바뀌어도 저장은 유지됩니다.</p></footer>
    </main>
    <main id="settingsView" hidden>
      <header>
        <div><small>FERAL</small><h1>환경 설정</h1></div>
        <button class="launcherBack">← 처음으로</button>
      </header>
      <div class="launcherBody">
        <div id="settingsFields"></div>
        <p>모든 월드에 함께 적용됩니다. 게임 안 메뉴의 환경 설정과 같은 값입니다. 버튼 위치·크기를 바꾸는 UI 배치 편집은 게임 화면 위에서 해야 하므로 게임 안 메뉴 → 환경 설정에 있습니다.</p>
      </div>
    </main>
    <main id="updatesView" hidden>
      <header>
        <div><small>FERAL</small><h1>업데이트</h1></div>
        <button class="launcherBack">← 처음으로</button>
      </header>
      <div class="launcherBody" id="updatesPanel"></div>
    </main>
    <dialog id="worldDialog">
      <h2 id="worldDialogTitle">새로운 세계</h2>
      <form id="worldForm">
        <label id="presetField">맵<select id="preset" aria-label="맵"></select></label>
        <p id="presetDescription" class="presetDescription"></p>
        <label>월드 이름<input id="worldName" maxlength="40" placeholder="새 월드 이름" aria-label="월드 이름" required /></label>
        <label>시드<input id="worldSeed" type="number" min="0" max="2147483647" value="63026" aria-label="월드 시드" /></label>
        <fieldset id="worldRules"><legend>월드 설정</legend></fieldset>
        <div class="dialogActions"><button type="button" id="worldCancel">취소</button><button id="worldSubmit">월드 만들기</button></div>
      </form>
    </dialog>
    <dialog id="confirm">
      <p id="confirmText"></p>
      <div class="dialogActions"><button id="deleteNo">취소</button><button id="deleteYes">삭제</button></div>
    </dialog>
    <script type="module" src="launcher.js"></script>
  </body>
</html>
