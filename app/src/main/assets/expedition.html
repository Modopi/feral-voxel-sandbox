<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FERAL · 탐험</title><link rel="stylesheet" href="content-runtime/expedition.css"></head>
<body>
 <canvas id="scene" aria-label="탐험 세계"></canvas>
 <header id="topbar"><div><b>FERAL</b><span id="region">세계를 준비하는 중</span></div><div class="stats"><span id="hp"></span><span id="calories"></span><button id="openBag">가방·제작</button><button id="openMenu">메뉴</button></div></header>
 <aside id="journey"><small>개척자의 기록</small><strong id="objective">주변의 나뭇가지와 돌을 모으세요.</strong><span id="progress"></span></aside>
 <div id="crosshair" aria-hidden="true">＋</div><div id="aimLabel"></div><div id="warning" role="alert" aria-live="assertive"></div>
 <div id="toast" role="status"></div><div id="actionProgress"></div>
 <div id="movePad" aria-label="이동 조이스틱"><span id="stick"></span><small>이동</small></div>
 <div id="actions"><button id="attackMode" style="grid-column:span 2">공격 방식: 일반 타격</button><button id="use">사용·채집</button><button id="attack">공격</button><button id="jump">점프</button><button id="stance">웅크리기</button><button id="sprint" aria-pressed="false">달리기</button><button id="descend" class="hidden">하강</button><button id="brake" class="hidden">제동</button></div>
 <div id="keys">WASD 이동 · Shift 달리기 · 마우스 드래그 시점 · E 사용 · 좌클릭 공격 · Space 점프 · Tab 가방 · 조종 중 Shift 하강 · Ctrl 제동</div>
 <section id="panel" class="hidden" aria-label="가방과 제작"><header><div><small>여정의 준비</small><h1 id="panelTitle">가방과 연구</h1></div><button id="closePanel" aria-label="닫기">닫기 ×</button></header><nav id="tabs"><button data-tab="inventory">가방</button><button data-tab="craft">제작</button><button data-tab="weapons">무기 제작</button><button data-tab="research">연구</button><button data-tab="energy">설비·에너지</button><button data-tab="machine">기계 조립</button><button data-tab="community">공동체</button><button data-tab="devices">던전 장치</button><button data-tab="faith">신앙·시련</button><button data-tab="journal">발견</button></nav><label class="search"><input id="search" placeholder="이름으로 찾기" aria-label="목록 검색"></label><div id="panelList"></div><footer id="workStatus"></footer></section>
 <section id="menu" class="hidden" aria-label="일시정지"><header><h1>탐험 메뉴</h1><button id="closeMenu">계속하기</button></header><div class="menuBody"><button id="save">지금 저장</button><button id="rest">휴식하기</button><button id="leave">저장 후 내 월드</button><p id="saveStatus" role="status"></p><h2>업데이트 <span id="updateBadge"></span></h2><p>게임 <span id="gameVersion"></span> · 앱 <span id="nativeVersion"></span></p><p id="updateConnection"></p><p id="updateMessage"></p><p>마지막 확인 <span id="updateLastCheck"></span></p><label><input type="checkbox" id="automaticUpdates"> 자동 확인</label><button id="checkUpdates">지금 확인</button><button id="chooseGameVersion">게임 버전 선택</button><button id="applyUpdate">저장 후 적용</button><button id="retryFailedUpdate" class="hidden">실패한 버전 다시 실행</button><button id="connectUpdates">업데이트 안내</button></div></section>
 <div id="loading"><b>FERAL</b><p id="loadingText">숲과 오래된 건축물을 준비하고 있습니다.</p><a href="worlds.html">내 월드로 돌아가기</a></div>
 <script type="module" src="content-runtime/entry.js"></script>
</body></html>
