name: FERAL versioned release
on:
  push:
    branches: [main, "V_**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: feral-stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare branch game version
        run: |
          python3 tools/prepare-branch.py
          node tools/version.mjs
      - name: Check versions and regressions
        run: |
          node tools/version.mjs --check
          node --test tests/*.test.js
      - name: Install Android build tools
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Build APK and signed game update
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then bash build-apk.sh; fi
          python3 tools/build-update.py
      - uses: actions/upload-artifact@v4
        with:
          name: feral-release
          path: |
            build/Feral-*-android.apk
            build/release/
      - name: Publish version and advance stable channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish-release.py
